{{- if .Values.flags.watchSingleNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "gha-runner-scale-set-controller.managerSingleNamespaceRoleName" . }}
  namespace: {{ include "gha-runner-scale-set-controller.namespace" . }}
rules:
- apiGroups:
  - actions.github.com
  resources:
  - autoscalinglisteners
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - actions.github.com
  resources:
  - autoscalinglisteners/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - actions.github.com
  resources:
  - autoscalinglisteners/finalizers
  verbs:
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - rolebindings
  verbs:
  - list
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  verbs:
  - list
  - watch
- apiGroups:
  - actions.github.com
  resources:
  - autoscalingrunnersets
  verbs:
  - list
  - watch
- apiGroups:
  - actions.github.com
  resources:
  - ephemeralrunnersets
  verbs:
  - list
  - watch
- apiGroups:
  - actions.github.com
  resources:
  - ephemeralrunners
  verbs:
  - list
  - watch
{{- end }}
{{- if .Values.flags.watchSingleNamespace }}
---
# Nodes are cluster-scoped and cannot be bound through a namespaced Role.
# This ClusterRole grants the minimum read access the EphemeralRunnerSet controller
# needs to gate runner creation on available node capacity.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "gha-runner-scale-set-controller.managerClusterRoleName" . }}-nodes
rules:
- apiGroups:
  - ""
  resources:
  - nodes
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "gha-runner-scale-set-controller.managerClusterRoleName" . }}-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "gha-runner-scale-set-controller.managerClusterRoleName" . }}-nodes
subjects:
- kind: ServiceAccount
  name: {{ include "gha-runner-scale-set-controller.serviceAccountName" . }}
  namespace: {{ include "gha-runner-scale-set-controller.namespace" . }}
{{- end }}
